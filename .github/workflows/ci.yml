# Container build, container test, and the Tekton pipeline run.
#
# There is deliberately no local container runtime requirement: every
# container action below happens on the GitHub-hosted runner, and each
# step tees its output into docs/evidence/ so the submission has real
# terminal output rather than a claim that it worked.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Jasmine unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Run Jasmine suite
        run: |
          set -o pipefail
          mkdir -p docs/evidence
          npm run test:all 2>&1 | tee docs/evidence/01-jasmine-unit-tests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-unit-tests
          path: docs/evidence

  build-image:
    name: Build the container image
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: |
          set -o pipefail
          mkdir -p docs/evidence
          {
            echo "=== docker build -t tax-calculator:1.0.0 . ==="
            docker build -t tax-calculator:1.0.0 .
          } 2>&1 | tee docs/evidence/02-docker-build.txt
      - name: Tag the image for the registry
        run: |
          set -o pipefail
          {
            docker tag tax-calculator:1.0.0 tax-calculator:latest
            echo "--- image list ---"
            docker images tax-calculator
            echo "--- image details ---"
            docker inspect tax-calculator:1.0.0 \
              --format 'Id={{.Id}} Created={{.Created}} Size={{.Size}} User={{.Config.User}} Entrypoint={{.Config.Cmd}}'
          } 2>&1 | tee docs/evidence/03-docker-image-details.txt
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-build-image
          path: docs/evidence

  test-container:
    name: Deploy and test the container
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the container
        run: |
          set -o pipefail
          mkdir -p docs/evidence
          docker build -t tax-calculator:1.0.0 . 
          {
            echo "=== docker run -d --name tax-calculator -p 8080:8080 tax-calculator:1.0.0 ==="
            docker run -d --name tax-calculator -p 8080:8080 tax-calculator:1.0.0
            echo
            echo "=== container log ==="
            sleep 4
            docker logs tax-calculator
            echo
            echo "=== docker ps ==="
            docker ps
            echo
            echo "=== docker ps (wide, showing the published port) ==="
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            echo
            echo "=== docker port tax-calculator ==="
            docker port tax-calculator
            echo
            echo "=== the application answering on port 8080 ==="
            curl -sS http://localhost:8080/api/health; echo
          } 2>&1 | tee docs/evidence/04-docker-image

      - name: Exercise the running application
        run: |
          set -o pipefail
          {
            echo "=== GET /api/health ==="
            curl -sS http://localhost:8080/api/health; echo
            echo
            echo "=== POST /api/calculate (82000 income, 5000 deductions) ==="
            curl -sS -X POST http://localhost:8080/api/calculate \
              -H 'Content-Type: application/json' \
              -d '{"grossIncome":82000,"deductions":5000,"vatAmount":2400,"vatRate":0.2}'; echo
            echo
            echo "=== POST /api/calculate (negative income is rejected) ==="
            curl -sS -o /dev/null -w 'HTTP %{http_code}\n' -X POST http://localhost:8080/api/calculate \
              -H 'Content-Type: application/json' -d '{"grossIncome":-5}'
            echo
            echo "=== GET / (frontend) ==="
            curl -sS http://localhost:8080/ | grep -o '<title>.*</title>'
            echo
            echo "=== container HEALTHCHECK status ==="
            docker inspect tax-calculator --format '{{.State.Health.Status}}'
          } 2>&1 | tee docs/evidence/05-container-test.txt

      - name: Assert the container served correct results
        run: |
          set -o pipefail
          HEALTH=$(curl -sS http://localhost:8080/api/health)
          echo "health: $HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          CALC=$(curl -sS -X POST http://localhost:8080/api/calculate \
            -H 'Content-Type: application/json' \
            -d '{"grossIncome":50000,"deductions":0}')
          echo "calc: $CALC"
          # 50000 income -> 6303.50 tax, cross-checked against the Decimal reference
          echo "$CALC" | grep -q '"incomeTax":6303.5'
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/)
          test "$STATUS" = "200"
          echo "all container assertions passed"
          docker rm -f tax-calculator >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: evidence-container
          path: docs/evidence

  tekton-pipeline:
    name: Tekton pipeline end to end
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cluster, registry and Tekton
        run: |
          set -o pipefail
          mkdir -p docs/evidence
          {
            echo "=== create the cluster first ==="
            # The `kind` docker network only exists once the cluster does, so
            # the registry cannot join it any earlier than this.
            kind create cluster --name tax-pipeline --wait 180s
            kubectl get nodes -o wide
            echo
            echo "=== registry Kaniko will push into ==="
            docker run -d --restart=always -p 5001:5000 --name kind-registry registry:2
            docker network connect kind kind-registry
            REGISTRY_IP=$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' kind-registry)
            # 5001 is the port published on the *host*. Inside the kind network
            # the registry is reached on its own port 5000, which is what
            # Kaniko and containerd must use.
            REGISTRY_PORT=5000
            echo "registry: ${REGISTRY_IP}:${REGISTRY_PORT} (host published on 5001)"
            echo "$REGISTRY_IP" > /tmp/registry-ip
            echo
            echo "=== is it actually listening? ==="
            curl -sS --max-time 10 "http://${REGISTRY_IP}:${REGISTRY_PORT}/v2/_catalog" || {
              echo "!! registry unreachable - Kaniko and containerd would both fail"
              docker logs kind-registry
              exit 1
            }
            echo " <- registry answers"
            echo
            echo "=== let the kubelets pull from that registry ==="
            # Build hosts.toml here on the runner with a heredoc and copy it
            # in. Writing it through nested `docker exec sh -c` quoting emitted
            # backslashes that containerd silently ignored, so the kubelet
            # fell back to HTTPS and failed with:
            #   http: server gave HTTP response to HTTPS client
            cat > /tmp/hosts.toml <<EOF
          [host."http://${REGISTRY_IP}:${REGISTRY_PORT}"]
            capabilities = ["pull","resolve","push"]
            skip_verify = true
          EOF
            NODE=$(kind get nodes --name tax-pipeline | head -1)
            for node in $(kind get nodes --name tax-pipeline); do
              docker exec "$node" mkdir -p "/etc/containerd/certs.d/${REGISTRY_IP}:${REGISTRY_PORT}"
              docker cp /tmp/hosts.toml "$node":"/etc/containerd/certs.d/${REGISTRY_IP}:${REGISTRY_PORT}/hosts.toml"
              echo "configured $node"
            done
            echo
            echo "=== hosts.toml as the node actually received it ==="
            docker exec "$NODE" cat "/etc/containerd/certs.d/${REGISTRY_IP}:${REGISTRY_PORT}/hosts.toml"
            echo
            echo "=== pre-flight: can the kubelet pull from this registry at all? ==="
            # Proves the config works in ~20s. Without it a bad registry config
            # only shows up as a 5-minute ImagePullBackOff in the deploy task.
            docker pull alpine:3.20
            # Push through the published host port: the Docker daemon treats
            # localhost as an insecure registry automatically, whereas pushing
            # straight to ${REGISTRY_IP} fails with
            #   http: server gave HTTP response to HTTPS client
            # Both land in the same registry, so containerd can then pull the
            # probe by its in-network address.
            docker tag alpine:3.20 "localhost:5001/pull-probe:1.0"
            docker push "localhost:5001/pull-probe:1.0"
            if ! docker exec "$NODE" crictl pull "${REGISTRY_IP}:${REGISTRY_PORT}/pull-probe:1.0"; then
              echo
              echo "!! containerd still cannot pull from the insecure registry"
              echo "   what the node has:"
              docker exec "$NODE" ls -R /etc/containerd/certs.d || true
              docker exec "$NODE" cat /etc/containerd/config.toml | head -20 || true
              exit 1
            fi
            echo "containerd pull OK - the deploy task should be able to pull"
            echo
            echo "=== install Tekton Pipelines v1.15.3 ==="
            kubectl apply --filename \
              https://github.com/tektoncd/pipeline/releases/download/v1.15.3/release.yaml
            echo
            echo "=== waiting for the Tekton control plane ==="
            if ! kubectl wait --for=condition=Available \
                 deployment/tekton-pipelines-controller \
                 deployment/tekton-pipelines-webhook \
                 -n tekton-pipelines --timeout=600s; then
              echo
              echo "!! Tekton did not become available - diagnostics follow"
              kubectl get pods -n tekton-pipelines -o wide
              kubectl describe deployment -n tekton-pipelines | tail -60
              kubectl logs -n tekton-pipelines deploy/tekton-pipelines-controller --tail=80 || true
              exit 1
            fi
            kubectl get pods -n tekton-pipelines
            kubectl get crd | grep -i tekton
          } 2>&1 | tee docs/evidence/06-tekton-install.txt

      - name: Apply the tasks and the pipeline
        run: |
          set -o pipefail
          {
            echo "=== kubectl apply -f tekton/tasks/ ==="
            kubectl apply -f tekton/tasks/
            echo
            echo "=== kubectl apply -f tekton/pipeline.yaml ==="
            kubectl apply -f tekton/pipeline.yaml
            echo
            echo "=== tasks ==="
            kubectl get task
            echo
            echo "=== pipeline task order ==="
            kubectl get pipeline tax-calculator-pipeline \
              -o jsonpath='{range .spec.tasks[*]}{.name}{"  runAfter="}{.runAfter}{"\n"}{end}'
          } 2>&1 | tee -a docs/evidence/06-tekton-install.txt

      - name: Give the pipeline permission to deploy
        run: |
          set -o pipefail
          mkdir -p docs/evidence
          {
            echo "=== service account for the PipelineRun ==="
            kubectl create serviceaccount tax-calculator-pipeline --dry-run=client -o yaml | kubectl apply -f -
            kubectl create clusterrolebinding tax-calculator-pipeline-admin \
              --clusterrole=cluster-admin \
              --serviceaccount=default:tax-calculator-pipeline \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl get serviceaccount tax-calculator-pipeline
          } 2>&1 | tee -a docs/evidence/06-tekton-install.txt

      - name: Run the Tekton pipeline
        run: |
          set -o pipefail
          mkdir -p docs/evidence
          {
          REGISTRY_IP=$(cat /tmp/registry-ip)
          sed "s#kind-registry:5000#${REGISTRY_IP}:5000#" tekton/run.yaml > /tmp/pipelinerun.yaml
          echo "--- pipelinerun applied ---"
          cat /tmp/pipelinerun.yaml
          kubectl apply -f /tmp/pipelinerun.yaml
          echo
          echo "=== watching the run ==="
          for i in $(seq 1 90); do
            S=$(kubectl get pipelinerun tax-calculator-run \
                 -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}' 2>/dev/null || true)
            echo "t=$((i*15))s status=${S:-running}"
            [ "$S" = "True" ] && break
            [ "$S" = "False" ] && break
            sleep 15
          done
          echo
          echo "=== pipelinerun ==="
          kubectl get pipelinerun
          echo
          echo "=== taskruns ==="
          kubectl get taskrun
          echo
          echo "=== pipeline status detail ==="
          kubectl get pipelinerun tax-calculator-run -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}'
          } 2>&1 | tee docs/evidence/07-tekton-pipelinerun.txt

      - name: Every task log
        if: always()
        run: |
          mkdir -p docs/evidence
          {
            echo "=== all taskruns ==="
            kubectl get taskrun -o wide
            echo
            echo "=== all pods ==="
            kubectl get pods -o wide
            echo
            echo "=== workspace claims ==="
            kubectl get pvc
            echo
            for tr in $(kubectl get taskrun -o name 2>/dev/null | cut -d/ -f2); do
              echo
              echo "############ taskrun: $tr ############"
              kubectl get taskrun "$tr" -o jsonpath='{.status.conditions[*]}{"\n"}'
              echo "--- steps ---"
              kubectl get taskrun "$tr" -o jsonpath='{range .status.steps[*]}step {.name}: {.terminated.reason} exit={.terminated.exitCode}{"\n"}{end}'
              echo "--- describe ---"
              kubectl describe taskrun "$tr" | tail -30
              echo "--- logs (label selector) ---"
              kubectl logs -l "tekton.dev/taskRun=$tr" --all-containers --prefix --tail=200 2>&1 || echo "(no logs)"
            done
            echo
            echo "=== recent cluster events ==="
            kubectl get events --sort-by=.lastTimestamp 2>/dev/null | tail -40
          } 2>&1 | tee docs/evidence/08-tekton-task-logs.txt

      - name: Verify the pipeline-deployed application
        if: always()
        run: |
          set -o pipefail
          {
            echo "=== what the deploy task created ==="
            kubectl get deployment,service,pods -o wide
            echo
            echo "=== pipeline result: deployed-url ==="
            kubectl get pipelinerun tax-calculator-run \
              -o jsonpath='{.status.pipelineResults[?(@.name=="deployed-url")].value}'; echo
            echo
            echo "=== call the deployed app ==="
            kubectl port-forward svc/tax-calculator 8080:80 >/tmp/pf.log 2>&1 &
            PF=$!
            sleep 8
            echo "--- GET /api/health ---"
            curl -sS http://localhost:8080/api/health; echo
            echo "--- POST /api/calculate (82000 income, 5000 deductions) ---"
            curl -sS -X POST http://localhost:8080/api/calculate \
              -H 'Content-Type: application/json' \
              -d '{"grossIncome":82000,"deductions":5000,"vatAmount":2400,"vatRate":0.2}'; echo
            kill $PF 2>/dev/null || true
          } 2>&1 | tee docs/evidence/09-tekton-deployed-app.txt

      - name: Copy evidence out of the builder pod
        if: always()
        run: echo "evidence captured from the cluster above"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-tekton
          path: docs/evidence
