<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tax Calculator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>Tax Calculator</h1><p class="sub">Progressive income tax, deductions and VAT</p></header>

<main>
  <form id="taxForm" novalidate>
    <label>Gross annual income (USD)
      <input type="number" id="grossIncome" value="82000" step="0.01" min="0" required>
    </label>
    <label>Pre-tax deductions
      <input type="number" id="deductions" value="5000" step="0.01" min="0">
    </label>
    <label>Taxable spend (for VAT)
      <input type="number" id="vatAmount" value="2400" step="0.01" min="0">
    </label>
    <label>VAT rate
      <select id="vatRate">
        <option value="0.2" selected>20%</option>
        <option value="0.075">7.5%</option>
        <option value="0.05">5%</option>
        <option value="0">0%</option>
      </select>
    </label>
    <button type="submit" id="calculateBtn">Calculate</button>
    <p id="error" hidden></p>
  </form>

  <section id="results" aria-live="polite">
    <div class="hero"><span>Take-home pay</span><strong id="takeHome">$0.00</strong></div>
    <dl>
      <div><dt>Gross income</dt><dd id="grossIncomeOut">$0.00</dd></div>
      <div><dt>Deductions</dt><dd id="deductionsOut">$0.00</dd></div>
      <div><dt>Taxable income</dt><dd id="taxableIncomeOut">$0.00</dd></div>
      <div><dt>Income tax</dt><dd id="incomeTaxOut">$0.00</dd></div>
      <div><dt>Effective rate</dt><dd id="effectiveRateOut">0%</dd></div>
      <div><dt>VAT</dt><dd id="vatOut">$0.00</dd></div>
    </dl>
    <h2>Bracket breakdown</h2>
    <table id="brackets"><thead><tr><th>Slice</th><th>Rate</th><th>Taxable</th><th>Tax</th></tr></thead><tbody></tbody></table>
  </section>
</main>

<footer><span id="healthBadge">checking service&hellip;</span></footer>
<script src="app.js"></script>
</body>
</html>
