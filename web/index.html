<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tax Calculator</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Tax Calculator</h1>
    <p class="sub">2024 US federal brackets, progressive by marginal rate.</p>

    <form id="tax-form" novalidate>
      <div class="field">
        <label for="gross-income">Gross income</label>
        <input type="number" id="gross-income" value="82000" min="0" step="0.01" required>
      </div>

      <div class="field">
        <label for="deductions">Deductions</label>
        <input type="number" id="deductions" value="5000" min="0" step="0.01">
      </div>

      <div class="field">
        <label for="vat-base">VAT-able spend</label>
        <input type="number" id="vat-base" value="2400" min="0" step="0.01">
      </div>

      <div class="field">
        <label for="vat-rate">VAT rate</label>
        <input type="number" id="vat-rate" value="20" min="0" step="0.01">
      </div>

      <button type="submit">Calculate</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <dl class="results" id="results" hidden>
      <div><dt>Taxable income</dt><dd id="r-taxable">-</dd></div>
      <div><dt>Income tax</dt>   <dd id="r-tax">-</dd></div>
      <div><dt>Effective rate</dt><dd id="r-rate">-</dd></div>
      <div><dt>VAT</dt>          <dd id="r-vat">-</dd></div>
      <div class="take-home"><dt>Take-home</dt><dd id="r-take">-</dd></div>
    </dl>
  </main>

  <script src="taxCalculator.js"></script>
  <script src="script.js"></script>
</body>
</html>
