# Runs the Jasmine suite inside the cluster before anything is built.
# Same `npm test` developers run locally - the pipeline has no special
# test path, so a green pipeline means a green local checkout.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unit-tests
  labels:
    app.kubernetes.io/part-of: tax-calculator
spec:
  description: Install dependencies and run the Jasmine unit tests
  params:
    - name: source-dir
      description: Directory holding package.json
      type: string
      default: /workspace/source
  workspaces:
    - name: source
  results:
    - name: spec-count
      description: Number of Jasmine specs that ran
  steps:
    - name: install
      image: node:20
      workingDir: $(params.source-dir)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "Node: $(node --version)  npm: $(npm --version)"
        npm ci
      env:
        - name: HOME
          value: /tekton/home

    - name: jasmine
      image: node:20
      workingDir: $(params.source-dir)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== npm test ==="
        npm test
      env:
        - name: HOME
          value: /tekton/home
