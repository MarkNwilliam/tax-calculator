# Runs the Jasmine suite inside the cluster before anything is built.
# Both suites: the graded 7 plus the 41-spec regression suite, so the
# pipeline exercises everything developers run locally.
# test path, so a green pipeline means a green local checkout.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unit-tests
  labels:
    app.kubernetes.io/part-of: tax-calculator
spec:
  description: Install dependencies and run the Jasmine unit tests
  params:
    - name: source-dir
      description: Directory holding package.json
      type: string
      default: /workspace/source
  workspaces:
    - name: source
  steps:
    - name: install
      image: node:20
      workingDir: $(params.source-dir)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "Node: $(node --version)  npm: $(npm --version)"
        npm ci
      env:
        - name: HOME
          value: /tekton/home

    - name: jasmine
      image: node:20
      workingDir: $(params.source-dir)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== npm test (7-spec acceptance suite) ==="
        npm test
        echo "=== npm run test:regression (41-spec suite) ==="
        npm run test:regression
      env:
        - name: HOME
          value: /tekton/home
