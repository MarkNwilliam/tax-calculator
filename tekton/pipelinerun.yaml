# Runs the pipeline against the local kind registry used in CI.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: tax-calculator-run
  labels:
    app.kubernetes.io/part-of: tax-calculator
spec:
  # The default service account cannot create deployments. This one can.
  # tekton.dev/v1 dropped spec.serviceAccountName in favour of
  # spec.taskRunTemplate.serviceAccountName.
  # Cluster-admin because it is a throwaway kind cluster in CI - a real
  # cluster would grant only apps/deployments and services on this namespace.
  taskRunTemplate:
    serviceAccountName: tax-calculator-pipeline
  # Required: a PipelineRun must name the pipeline it runs.
  pipelineRef:
    name: tax-calculator-pipeline
  # tekton.dev/v1 renamed `timeout` to the `timeouts` struct.
  timeouts:
    pipeline: 25m
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
  params:
    - name: repo-url
      value: https://github.com/MarkNwilliam/tax-calculator.git
    - name: revision
      value: main
    - name: image-url
      value: kind-registry:5000/tax-calculator:1.0.0
    - name: push-image
      value: "false"
