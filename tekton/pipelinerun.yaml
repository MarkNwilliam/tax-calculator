# Runs the pipeline against the local kind registry used in CI.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: tax-calculator-run
  labels:
    app.kubernetes.io/part-of: tax-calculator
spec:
  timeout: 25m
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
  params:
    - name: image-url
      value: kind-registry:5001/tax-calculator:1.0.0
    - name: push-image
      value: "false"
